name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # No external deps (no go.sum) yet, so caching has nothing to key on.
          cache: false

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -race -coverprofile=coverage.out

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.out

  python:
    name: Python helpers (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pythontools
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pythontools/requirements.txt

      - name: Install pytest
        run: pip install -r requirements.txt

      - name: Test helpers
        run: python -m pytest -v